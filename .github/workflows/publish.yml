name: Publish

# Publishes a GitHub release to Open VSX and the VS Code Marketplace with trusted publishing: each
# store exchanges GitHub's OIDC token for a short-lived credential, so no access token is stored in
# this repository. Both registrations name this file (publish.yml) and the `publish` environment;
# give that environment required reviewers so nothing is published without an approval.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  package:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$version"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run audit:prod
      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: git-history-plus-*.vsix
          if-no-files-found: error

  # Each store publishes the same .vsix in its own job: a failure in one doesn't block the other,
  # and re-running only the failed job doesn't try to publish a version twice.
  open-vsx:
    name: Open VSX
    needs: package
    # Skipped until the repository variable PUBLISH_OPEN_VSX is set to `true` (Open VSX needs a
    # one-time manual first publish and a trusted-publisher registration).
    if: vars.PUBLISH_OPEN_VSX == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # for the OIDC token Open VSX exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes ovsx@1.3.0 publish --trusted-publishing --packagePath git-history-plus-*.vsix

  marketplace:
    name: VS Code Marketplace
    needs: package
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # for the OIDC token the Marketplace exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath git-history-plus-*.vsix
