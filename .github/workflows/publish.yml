name: Publish to Open VSX

# Publishes with Open VSX trusted publishing: GitHub's OIDC token is exchanged for a short-lived,
# single-extension token, so no access token is stored in this repository. The registration on
# open-vsx.org names this file (publish.yml) and the `publish` environment; give that environment
# required reviewers so nothing is published without an approval.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Open VSX
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # for the OIDC token Open VSX exchanges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$version"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run audit:prod
      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package
        run: npm run package

      - name: Publish
        run: npx --yes ovsx@1.3.0 publish --trusted-publishing --packagePath git-history-plus-*.vsix
